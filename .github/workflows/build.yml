name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Set version (major.minor from package.json, patch = build number)
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VER="$BASE.${{ github.run_number }}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify updater is packaged
        shell: bash
        run: |
          test -f dist/win-unpacked/resources/app-update.yml
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar > asar.txt
          grep -qi "electron-updater" asar.txt
          grep -qi "tab-preload.js" asar.txt
          echo "OK: updater and tab preload are inside the app"

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBrowser-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Proxy Browser ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          overwrite_files: true
          make_latest: true
