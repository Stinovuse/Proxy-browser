name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Set version (major.minor from package.json, patch = build number)
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VER="$BASE.${{ github.run_number }}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify updater is packaged
        shell: bash
        run: |
          test -f dist/win-unpacked/resources/app-update.yml
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar > asar.txt
          grep -qi "electron-updater" asar.txt
          grep -qi "tab-preload.js" asar.txt
          echo "OK: updater and tab preload are inside the app"
          npx --yes @electron/fuses read --app "dist/win-unpacked/S Browser.exe" | tee fuses.txt
          grep -Eq "RunAsNode is Disabled" fuses.txt
          grep -Eq "EnableNodeCliInspectArguments is Disabled" fuses.txt
          grep -Eq "OnlyLoadAppFromAsar is Enabled" fuses.txt

      - name: Smoke test (launch the app on Windows)
        shell: pwsh
        run: |
          $d = Join-Path $env:APPDATA 'SBrowser'
          New-Item -ItemType Directory -Force $d | Out-Null
          '{"type":"http","host":"127.0.0.1","port":9,"user":"","incognito":true,"tzV2":true}' | Set-Content (Join-Path $d 'config.json')
          $p = Start-Process -FilePath 'dist\win-unpacked\S Browser.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Error 'App did not exit in time'; exit 1 }
          Write-Host "Exit code: $($p.ExitCode)"
          if (Test-Path (Join-Path $d 'smoke.json')) { Get-Content (Join-Path $d 'smoke.json') }
          if (Test-Path (Join-Path $d 'error.log')) { Write-Host '--- error.log ---'; Get-Content (Join-Path $d 'error.log') }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer screenshots (design check)
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: ./tools/installer-screens.ps1 -Out installer-screens

      - name: Upload installer screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: installer-screens
          path: installer-screens/*.png
          retention-days: 7

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SBrowser-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: S Browser ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          overwrite_files: true
          make_latest: true
