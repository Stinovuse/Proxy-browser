<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; form-action https://duckduckgo.com">
<title>Новая вкладка</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="bg"><i class="o1"></i><i class="o2"></i><i class="o3"></i><div class="grid"></div></div>

  <main>
    <div class="brand"><img src="icon.png" alt=""><span>S Browser</span></div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>

    <form id="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
      <svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" name="q" placeholder="Поиск в DuckDuckGo или адрес сайта" spellcheck="false" autofocus>
      <button type="submit" aria-label="Найти"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>

    <section id="tiles"></section>
  </main>

  <footer>
    <div id="proxy" class="chip"><span class="dot"></span><span id="ptext">Проверка прокси…</span></div>
    <div class="chip muted">Поиск: DuckDuckGo</div>
  </footer>
  <script src="newtab.js"></script>
</body>
</html>
