<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>S Browser</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: #ddd;
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  #top { height: 112px; background: #1e1f22; position: relative; z-index: 2; }
  #tabs { display: flex; height: 36px; padding: 4px 6px 0; gap: 4px; align-items: flex-end; }
  .tab { display: flex; align-items: center; gap: 6px; min-width: 60px; max-width: 220px; flex: 1 1 180px;
    height: 32px; padding: 0 8px 0 12px; background: #2b2d31; border-radius: 8px 8px 0 0; cursor: default; }
  .tab.active { background: #3a3d43; }
  .tab .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { width: 18px; height: 18px; border-radius: 4px; text-align: center; line-height: 18px; opacity: .6; }
  .tab .x:hover { background: #55585f; opacity: 1; }
  .spin { width: 10px; height: 10px; border: 2px solid #888; border-top-color: transparent; border-radius: 50%;
    animation: r .8s linear infinite; flex: none; }
  @keyframes r { to { transform: rotate(360deg); } }
  #newtab { width: 28px; height: 28px; border: 0; background: none; color: #bbb; font-size: 18px; border-radius: 6px; margin-bottom: 2px; }
  #newtab:hover { background: #2b2d31; }
  #bar { display: flex; height: 44px; align-items: center; gap: 4px; padding: 0 8px; background: #3a3d43; }
  #bar button { width: 30px; height: 30px; border: 0; background: none; color: #ddd; border-radius: 6px; font-size: 16px; }
  #bar button:hover:not(:disabled) { background: #4a4d55; }
  #bar button:disabled { opacity: .35; }
  #addr { flex: 1; height: 30px; border: 1px solid #4a4d55; border-radius: 15px; background: #1e1f22;
    color: #eee; padding: 0 14px; font: inherit; outline: none; user-select: text; }
  #addr:focus { border-color: #6c8cff; }
  #ip { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 12px;
    white-space: nowrap; cursor: pointer; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  #ip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  #ip.ok { background: #1f3d2a; color: #7ee2a0; }
  #ip.warn { background: #3d351f; color: #ffd166; }
  #ip.bad { background: #4a1f22; color: #ff8a8a; }
  #ip.wait { background: #33363c; color: #c9c9c9; }
  #ip.wait .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #star { font-size: 18px !important; }
  #tr { width: auto !important; padding: 0 6px; font-size: 13px !important; font-weight: 600; }
  #tr.on { background: #2b3f73 !important; color: #a9bcff; }
  #upd { width: auto !important; padding: 0 10px; background: #1f3d2a !important; color: #7ee2a0 !important;
    font-size: 12px !important; border-radius: 12px !important; }
  #star.on { color: #ffd166; }
  #bm { display: flex; height: 32px; align-items: center; gap: 2px; padding: 0 8px; background: #3a3d43;
    border-bottom: 1px solid #2b2d31; overflow: hidden; }
  .bm { display: flex; align-items: center; gap: 6px; max-width: 180px; height: 24px; padding: 0 8px;
    border-radius: 12px; cursor: default; white-space: nowrap; }
  .bm:hover { background: #4a4d55; }
  .bm .ic { flex: none; width: 16px; height: 16px; border-radius: 4px; color: #fff; font-size: 10px;
    font-weight: 600; text-align: center; line-height: 16px; }
  .bm .n { overflow: hidden; text-overflow: ellipsis; }
  .bm input { width: 130px; height: 20px; background: #1e1f22; color: #eee; border: 1px solid #6c8cff;
    border-radius: 4px; font: inherit; padding: 0 4px; outline: none; }
  #bmhint { color: #888; font-size: 12px; padding-left: 4px; }
  /* ---- Кнопка и панель загрузок ---- */
  #dl { position: relative; }
  #dl svg { position: absolute; inset: 1px; width: 28px; height: 28px; transform: rotate(-90deg); pointer-events: none; }
  #dl .ring-bg { stroke: #55585f; }
  #dl .ring { stroke: #6c8cff; transition: stroke-dashoffset .25s; }
  #dl.done .ring { stroke: #7ee2a0; }
  #dl .ico { position: relative; }
  #dl .badge { position: absolute; top: -2px; right: -3px; min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 7px; background: #6c8cff; color: #fff; font-size: 9px; line-height: 14px; font-weight: 700; }
  #dl.active { background: #2b3f73 !important; }
  #overlay { position: fixed; inset: 112px 0 0 0; display: none; z-index: 3; }
  #dlpanel { position: fixed; top: 82px; right: 8px; width: 400px; max-height: calc(100vh - 100px); display: none;
    flex-direction: column; background: #2b2d31; border: 1px solid #44474e; border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); z-index: 4; overflow: hidden; }
  body.dl-open #overlay { display: block; }
  body.dl-open #dlpanel { display: flex; }
  #dlpanel header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #3a3d43; }
  #dlpanel header b { flex: 1; font-size: 14px; }
  #dlpanel header button, .di button { border: 0; background: #3a3d43; color: #ddd; border-radius: 6px;
    padding: 4px 9px; font: inherit; font-size: 12px; cursor: default; }
  #dlpanel header button:hover, .di button:hover { background: #4a4d55; }
  #dllist { overflow-y: auto; padding: 4px 0; }
  #dlempty { padding: 24px; text-align: center; color: #888; }
  .di { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 4px 10px; padding: 8px 12px; }
  .di:hover { background: #33363c; }
  .di .fi { grid-row: span 3; width: 32px; height: 32px; border-radius: 6px; background: #3a3d43; color: #aab;
    font-size: 10px; font-weight: 700; display: grid; place-items: center; text-transform: uppercase; }
  .di .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #eee; }
  .di .bar { height: 4px; border-radius: 2px; background: #44474e; overflow: hidden; }
  .di .bar i { display: block; height: 100%; background: #6c8cff; transition: width .25s; }
  .di.paused .bar i { background: #ffd166; }
  .di.indet .bar i { width: 30% !important; animation: indet 1.2s linear infinite; }
  @keyframes indet { from { margin-left: -30%; } to { margin-left: 100%; } }
  .di .meta { display: flex; align-items: center; gap: 6px; color: #999; font-size: 12px; }
  .di .meta button { flex: none; }
  .di .meta span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .di.failed .meta span { color: #ff8a8a; }
  .di.completed .meta span { color: #7ee2a0; }
  #toast { position: fixed; right: 12px; top: 4px; z-index: 5; background: #6c8cff; color: #fff; padding: 4px 10px;
    border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
 <div id="top">
  <div id="tabs"><button id="newtab" title="Новая вкладка (Ctrl+T)">+</button></div>
  <div id="bar">
    <button id="back" title="Назад (Alt+←)">←</button>
    <button id="fwd" title="Вперёд (Alt+→)">→</button>
    <button id="reload" title="Обновить (Ctrl+R)">⟳</button>
    <input id="addr" spellcheck="false" placeholder="Адрес или поиск">
    <button id="tr" title="Перевести страницу (Ctrl+Shift+Y)">文A</button>
    <button id="star" title="Добавить в закладки (Ctrl+D)">☆</button>
    <span id="ip" class="wait" title="Подключение к прокси…"><i class="dot"></i><span id="iptext">Подключение…</span></span>
    <button id="upd" title="Установить обновление и перезапустить" style="display:none">⬆</button>
    <button id="dl" title="Загрузки">
      <svg viewBox="0 0 28 28"><circle class="ring-bg" cx="14" cy="14" r="12" fill="none" stroke-width="2" opacity="0"/>
        <circle class="ring" cx="14" cy="14" r="12" fill="none" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="75.4" stroke-dashoffset="75.4" opacity="0"/></svg>
      <span class="ico">⤓</span><span class="badge" style="display:none"></span>
    </button>
    <button id="settings" title="Настройки прокси">⚙</button>
  </div>
  <div id="bm"><span id="bmhint">Нажмите ☆ или Ctrl+D, чтобы закрепить страницу здесь</span></div>
 </div>
  <div id="overlay"></div>
  <div id="dlpanel">
    <header><b>Загрузки</b><button id="dlfolder">Открыть папку</button><button id="dlclear">Очистить</button></header>
    <div id="dllist"></div>
    <div id="dlempty">Загрузок пока нет</div>
  </div>
  <div id="toast"></div>
  <script src="index.js"></script>
</body>
</html>
