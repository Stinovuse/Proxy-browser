<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>S Browser</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
 <div id="top">
  <div id="tabsrow">
    <div id="logo" title="S Browser"><img src="icon.png" alt=""></div>
    <div id="tabs"></div>
    <button id="newtab" class="ib" title="Новая вкладка (Ctrl+T)" data-icon="plus"></button>
    <div class="drag"></div>
  </div>

  <div id="bar">
    <button id="back" class="ib" title="Назад (Alt+←)" data-icon="back"></button>
    <button id="fwd" class="ib" title="Вперёд (Alt+→)" data-icon="fwd"></button>
    <button id="reload" class="ib" title="Обновить (Ctrl+R)" data-icon="reload"></button>

    <div id="omni">
      <span id="sec" title="" data-icon="lock"></span>
      <input id="addr" spellcheck="false" placeholder="Введите адрес или запрос">
      <button id="tr" class="ib sm" title="Перевести страницу (Ctrl+Shift+Y)" data-icon="translate"></button>
      <button id="star" class="ib sm" title="Добавить в закладки (Ctrl+D)" data-icon="star"></button>
    </div>

    <div id="ip" class="wait" title="Подключение к прокси…">
      <span class="dot"></span><span id="iptext">Подключение…</span>
    </div>
    <button id="upd" title="Установить обновление и перезапустить" style="display:none"></button>
    <button id="dl" class="ib" title="Загрузки">
      <svg class="ringsvg" viewBox="0 0 36 36">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/>
        </linearGradient></defs>
        <circle class="ring-bg" cx="18" cy="18" r="15" fill="none" stroke-width="2.5"/>
        <circle class="ring" cx="18" cy="18" r="15" fill="none" stroke-width="2.5" stroke-linecap="round"
                stroke-dasharray="94.25" stroke-dashoffset="94.25"/>
      </svg>
      <span class="ico" data-icon="download"></span>
      <span class="badge"></span>
    </button>
    <button id="settings" class="ib" title="Настройки" data-icon="sliders"></button>
  </div>

  <div id="bm"><span id="bmhint">Нажмите <b>★</b> или Ctrl+D, чтобы закрепить страницу здесь</span></div>
  <div id="loadbar"></div>
 </div>

  <div id="overlay"></div>
  <section id="dlpanel" aria-label="Загрузки">
    <header>
      <div class="ttl"><b>Загрузки</b><span id="dlsum"></span></div>
      <button id="dlfolder" class="ib sm" title="Открыть папку загрузок" data-icon="folder"></button>
      <button id="dlclear" class="ib sm" title="Убрать завершённые из списка" data-icon="sweep"></button>
    </header>
    <div id="dllist"></div>
    <div id="dlempty"><span data-icon="download"></span><p>Загрузок пока нет</p><small>Скачанные файлы появятся здесь</small></div>
  </section>
  <div id="toast"></div>
  <script src="icons.js"></script>
  <script src="index.js"></script>
</body>
</html>
